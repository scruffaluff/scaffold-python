# Python configuration file for building, dependencies, and tooling.
#
# For more information, visit
# https://snarky.ca/what-the-heck-is-pyproject-toml/.

[dependency-groups]
dev = [
    "black>=24.10.0,<25.0.0",
    "flake8>=7.1.0,<8.0.0",
    "flake8-bugbear>=24.12.0,<25.0.0",
    "flake8-docstrings>=1.7.0,<2.0.0",
    "flake8-import-order>=0.18.0,<0.19.0",
    "mccabe>=0.7.0,<0.8.0",
    "mkdocs>=1.6.0,<2.0.0",
    "mkdocs-material>=9.5.0,<10.0.0",
    "mypy>=1.14.0,<2.0.0",
    "pymdown-extensions>=10.14.0,<11.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-cookies>=0.7.0,<0.8.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "types-toml>=0.10.0,<0.11.0",
]

[project]
authors = [{ email = "macklan.weinstein@gmail.com", name = "Macklan Weinstein" }]
description = "Python project template for scaffolding."
keywords = []
license = "MIT"
name = "scaffold-python"
readme = "README.md"
requires-python = ">=3.9.0,<4.0.0"
version = "0.2.1"

[tool.black]
extend-exclude = "{{cookiecutter.project_name}}/*"
line-length = 80

[tool.mypy]
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_defs = true
exclude = [
    '\.benchmarks/',
    '\.cache/',
    '\.hypothesis/',
    '\.pytest_cache/',
    '\.venv/',
    'tmp/',
    '\{\{cookiecutter.project_name\}\}/',
]
ignore_missing_imports = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-sv"
filterwarnings = ["ignore::DeprecationWarning"]
python_classes = "Test*"
python_files = ["__init__.py", "test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.uv]
package = false
